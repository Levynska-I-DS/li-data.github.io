  let lang = localStorage.getItem('em_lang') || 'de';
  if (!STRINGS[lang]) lang = 'de';
  let rerenderCurrent = () => {};

  function t(key, ...args) {
    const entry = STRINGS[lang][key];
    return typeof entry === 'function' ? entry(...args) : entry;
  }

  function langBarHtml() {
    const labels = { de: 'DE', en: 'EN', ru: 'RU' };
    return `<div class="lang-switch" style="display:flex; gap:6px; justify-content:flex-end; margin-bottom:10px;">${
      Object.keys(labels).map(code => `<button type="button" class="button secondary lang-btn" data-lang="${code}" style="padding:4px 12px; ${code === lang ? 'font-weight:700; text-decoration:underline;' : ''}">${labels[code]}</button>`).join('')
    }</div>`;
  }

  // Every screen goes through render() so the language bar and its click
  // handlers stay attached no matter which view (code gate / form / thanks
  // / closed) is currently showing. onRerender re-draws the SAME view after
  // a language switch, without re-fetching data from Supabase.
  function render(innerHtml, onRerender) {
    area.innerHTML = langBarHtml() + innerHtml;
    rerenderCurrent = onRerender || (() => {});
    area.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        lang = btn.dataset.lang;
        localStorage.setItem('em_lang', lang);
        rerenderCurrent();
      });
    });
  }

  const area = document.getElementById('register-area');
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('event');
  const codeFromUrl = params.get('code') || '';

  async function init() {
    if (!slug) {
      render(`<div class="em-card"><p>${t('missingSlug')}</p></div>`, init);
      return;
    }

    const { data: ev, error } = await supabase
      .from('events')
      .select('id, slug, title, starts_at, location, meal_type, non_member_fee, fee_mode, fee_amount_child, requires_code, order_products, registration_deadline, status, has_kindertisch, has_seating, tables')
      .eq('slug', slug)
      .single();

    if (error || !ev) {
      console.error('Supabase error loading event (slug=' + slug + '):', error);
      render(`<div class="em-card"><p>${t('notFound')}</p></div>`, init);
      return;
    }

    if (ev.registration_deadline && new Date() > new Date(ev.registration_deadline)) {
      renderClosed(ev);
    } else if (!ev.requires_code) {
      renderForm(ev, null);
    } else {
      await tryUnlock(ev, codeFromUrl);
    }
  }

  function renderClosed(ev) {
    const dateStr = new Date(ev.registration_deadline).toLocaleString(LOCALE[lang]);
    render(`
      <div class="em-card">
        <h2>${t('closedTitle')}</h2>
        <p>${t('closedText', dateStr)}</p>
        <a class="button secondary" href="event.html?event=${ev.slug}">${t('backToEvent')}</a>
      </div>
    `, () => renderClosed(ev));
  }

  async function tryUnlock(ev, code, showErrorIfEmpty) {
    if (code) {
      const { data: rows } = await supabase.rpc('validate_invitation', { p_slug: ev.slug, p_code: code });
      const invitation = rows && rows[0];
      if (invitation) {
        renderForm(ev, invitation);
        return;
      }
    }
    renderCodeGate(ev, code && showErrorIfEmpty !== false);
  }

  function renderCodeGate(ev, showInvalidMessage) {
    render(`
      <div class="em-card">
        ${ev.status !== 'published' ? '<p style="background:#fff3cd; color:#7a5c00; padding:6px 10px; border-radius:6px; font-size:0.85em;">Vorschau — dieses Event ist noch nicht veröffentlicht (Status: ' + ev.status + ') und für Besucher nicht sichtbar.</p>' : ''}
        <h2>${t('registrationTitle', ev.title)}</h2>
        <p>${t('codeGateIntro')}</p>
        <form id="code-form" class="em-form">
          <label for="code-input">${t('codeLabel')}</label>
          <input type="text" id="code-input" required style="text-transform:uppercase;">
          ${showInvalidMessage ? `<p style="color:#cc0000;">${t('codeInvalid')}</p>` : ''}
          <button type="submit" class="button" style="margin-top:16px;">${t('continueBtn')}</button>
        </form>
      </div>
    `, () => renderCodeGate(ev, showInvalidMessage));

    document.getElementById('code-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const entered = document.getElementById('code-input').value.trim();
      await tryUnlock(ev, entered, true);
    });
  }

        <label style="display:flex; align-items:center; gap:6px; font-weight:normal; font-size:0.9em; margin-top:6px;">

  // Age as of the event's date (falls back to today if the event has no start date) --
  // computed from the birth date rather than typed in, so it never goes stale.
  function ageFromBirthDate(birthDateStr, referenceDateStr) {
    if (!birthDateStr) return null;
    const birth = new Date(birthDateStr);
    const reference = referenceDateStr ? new Date(referenceDateStr) : new Date();
    let age = reference.getFullYear() - birth.getFullYear();
    const hadBirthdayYet = (reference.getMonth() > birth.getMonth())
      || (reference.getMonth() === birth.getMonth() && reference.getDate() >= birth.getDate());
    if (!hadBirthdayYet) age -= 1;
    return age;
  }

            <label style="display:flex; align-items:flex-start; gap:8px; font-weight:normal;">
              <input type="checkbox" id="privacy_consent" required style="width:auto; margin-top:4px;">
              ${t('privacyConsent', `<a href="../datenschutz.html" target="_blank">`, '</a>')}
            </label>
          </div>

          <p id="form-error" style="color:#cc0000; display:none;"></p>

          <button type="submit" class="button" style="margin-top:16px;">${t('submitBtn')}</button>
        </form>
      </div>
    `, () => renderForm(ev, invitation));

    const form = document.getElementById('register-form');
    const guestsInput = document.getElementById('guests_count');
    const memberStatusSelect = document.getElementById('member_status');
    const tableSelect = document.getElementById('table_id');
    const childrenList = document.getElementById('children-list');
    const addChildBtn = document.getElementById('add-child');
    const under6Block = document.getElementById('under6-block');
    const under6Ack = document.getElementById('under6_ack');
    const nonMemberBlock = document.getElementById('non-member-block');
    const nonMemberAck = document.getElementById('non_member_ack');
    const idCheckText = document.getElementById('id-check-text');
    const feeAmountLine = hasFee ? document.getElementById('fee-amount-line') : null;
    const formError = document.getElementById('form-error');
    let childIdx = 0;
    let currentFeeAmount = 0;

    // Table/seat picker: populated with remaining-capacity info from
    // get_table_occupancy, a narrow SECURITY DEFINER function (see migration
    // 020) that only ever returns aggregated seat counts per table -- never
    // any personal data. Only confirmed registrations count as occupied, so
    // a table only looks "full" once seats are actually confirmed there.
    const hasTables = !!(ev.has_seating && ev.tables && ev.tables.length);
    let tableOccupancy = {};

    async function loadTableOccupancy() {
      if (!hasTables) return;
      const { data, error: occError } = await supabase.rpc('get_table_occupancy', { p_event_id: ev.id });
      if (!occError && data) {
        tableOccupancy = Object.fromEntries(data.map(row => [row.table_id, Number(row.occupied) || 0]));
      }
      renderTableOptions();
    }

    function renderTableOptions() {
      if (!hasTables) return;
      const previousValue = tableSelect.value;
      const requested = Number(guestsInput.value) || 1;
      tableSelect.innerHTML = `<option value="">${t('tableChoosePlaceholder')}</option>` + ev.tables.map(table => {
        const occupied = tableOccupancy[table.id] || 0;
        const free = Math.max(table.capacity - occupied, 0);
        const isFull = free <= 0;
        const label = `${table.name} — ${isFull ? t('tableFull') : t('tableSeatsFree', free)}`;
        return `<option value="${table.id}" ${free < requested ? 'disabled' : ''}>${label}</option>`;
      }).join('');
      if (previousValue) tableSelect.value = previousValue;
    }

    // Recomputes the displayed participation fee whenever the guest count or the
    // list of children changes. ev.fee_mode decides how non_member_fee (and, for
    // adult_child, ev.fee_amount_child) combine with the current form state.
    function updateFeeAmount() {
      if (!hasFee) return;
      const totalGuests = Number(guestsInput.value) || 0;
      const childrenCount = childrenList.querySelectorAll('.child-row').length;
      const rate = Number(ev.non_member_fee);
      let text, total;
      if (ev.fee_mode === 'person') {
        total = rate * totalGuests;
        text = t('feeAmountPerson', rate.toFixed(2), totalGuests, total.toFixed(2));
      } else if (ev.fee_mode === 'adult_child') {
        const childRate = Number(ev.fee_amount_child) || 0;
        const adults = Math.max(totalGuests - childrenCount, 0);
        total = rate * adults + childRate * childrenCount;
        text = t('feeAmountAdultChild', rate.toFixed(2), childRate.toFixed(2), adults, childrenCount, total.toFixed(2));
      } else {
        total = rate;
        text = t('feeAmountFamily', rate.toFixed(2));
      }
      currentFeeAmount = total;
      feeAmountLine.textContent = text;
    }

    function updateNonMemberVisibility() {
      const isNonMember = memberStatusSelect.value === 'no';
      nonMemberBlock.style.display = isNonMember ? 'block' : 'none';
      if (!isNonMember) nonMemberAck.checked = false;
    }

    // Reuses the event's own Anmeldeschluss (registration_deadline) as the deadline
    // for both the fee payment and the ID copy -- one date for a non-member to keep
    // in mind, instead of introducing a second, separate deadline field.
    idCheckText.textContent = ev.registration_deadline
      ? t('idCheckText', new Date(ev.registration_deadline).toLocaleDateString(LOCALE[lang]))
      : t('idCheckTextNoDeadline');

    function updateUnder6Visibility() {
      const anyUnder6 = [...childrenList.querySelectorAll('.child-row')].some(row => {
        const birthDate = row.querySelector('.child-birth-date').value;
        if (!birthDate) return false;
        const age = ageFromBirthDate(birthDate, ev.starts_at);
        return age !== null && age < 6;
      });
      under6Block.style.display = anyUnder6 ? 'block' : 'none';
      if (!anyUnder6) under6Ack.checked = false;
    }

    function addChildRow() {
      childIdx += 1;
      childrenList.insertAdjacentHTML('beforeend', childRowHtml(childIdx, ev.has_kindertisch));
      const row = childrenList.lastElementChild;
      row.querySelector('.remove-child').addEventListener('click', () => {
        row.remove();
        updateUnder6Visibility();
        updateFeeAmount();
      });
      row.querySelector('.child-birth-date').addEventListener('change', updateUnder6Visibility);
      updateFeeAmount();
    }

    addChildBtn.addEventListener('click', addChildRow);
    guestsInput.addEventListener('input', updateFeeAmount);
    if (hasTables) guestsInput.addEventListener('input', renderTableOptions);
    memberStatusSelect.addEventListener('change', updateNonMemberVisibility);
    updateFeeAmount();
    updateNonMemberVisibility();
    loadTableOccupancy();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      formError.style.display = 'none';

      const anyUnder6 = under6Block.style.display === 'block';
      if (anyUnder6 && !under6Ack.checked) {
        formError.textContent = t('errUnder6');
        formError.style.display = 'block';
        return;
      }
      if (memberStatusSelect.value === 'no' && !nonMemberAck.checked) {
        formError.textContent = t('errNonMemberAck');
        formError.style.display = 'block';
        return;
      }
      if (hasTables && !tableSelect.value) {
        formError.textContent = t('errTable');
        formError.style.display = 'block';
        return;
      }

      const payload = {
        event_id: ev.id,
        full_name: document.getElementById('full_name').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim() || null,
        member_status: memberStatusSelect.value,
        lang: lang,
        table_id: hasTables ? (tableSelect.value || null) : null,
        guests_count: Number(guestsInput.value) || 1,
        meal_count: Number(guestsInput.value) || 1,
        notes: document.getElementById('notes').value.trim() || null,
        privacy_consent: document.getElementById('privacy_consent').checked,
        fee_consent: (hasFee && memberStatusSelect.value === 'no') ? nonMemberAck.checked : null,
        id_check_ack: memberStatusSelect.value === 'no' ? nonMemberAck.checked : null,
        fee_amount_charged: (hasFee && memberStatusSelect.value === 'no') ? currentFeeAmount : null,
        under6_supervision_ack: anyUnder6 ? under6Ack.checked : null,
      };

      const { data: inserted, error } = await supabase.from('registrations').insert(payload).select().single();

      if (error) {
        formError.textContent = t('errGeneric', error.message);
        formError.style.display = 'block';
        return;
      }

      if (invitation) {
        await supabase.rpc('redeem_invitation', { p_invitation_id: invitation.invitation_id, p_registration_id: inserted.id });
      }

      const childRows = [...childrenList.querySelectorAll('.child-row')].map(row => {
        const birthDate = row.querySelector('.child-birth-date').value || null;
        const kindertischChoice = row.querySelector('.child-kindertisch:checked');
        return {
          registration_id: inserted.id,
          first_name: row.querySelector('.child-first-name').value.trim() || null,
          last_name: row.querySelector('.child-last-name').value.trim() || null,
          birth_date: birthDate,
          age: ageFromBirthDate(birthDate, ev.starts_at),
          allergies: row.querySelector('.child-allergies').value.trim() || null,
          at_kindertisch: kindertischChoice ? kindertischChoice.value === 'table' : null,
          needs_high_chair: row.querySelector('.child-high-chair').checked,
        };
      });

      if (childRows.length) {
        const { error: childError } = await supabase.from('registration_children').insert(childRows);
        if (childError) {
          formError.textContent = t('errChildren', childError.message);
          formError.style.display = 'block';
          return;
        }
      }

      const orderItemRows = [...document.querySelectorAll('.order-item-row')].map(row => {
        const qty = Number(row.querySelector('.order-item-qty').value) || 0;
        if (qty <= 0) return null;
        return {
          registration_id: inserted.id,
          product_name: row.dataset.name,
          unit_price: row.dataset.price ? Number(row.dataset.price) : null,
          quantity: qty,
        };
      }).filter(Boolean);

      if (orderItemRows.length) {
        const { error: orderError } = await supabase.from('registration_order_items').insert(orderItemRows);
        if (orderError) {
          formError.textContent = t('errOrders', orderError.message);
          formError.style.display = 'block';
          return;
        }
      }

      render(`
        <div class="em-card">
          <h2>${t('thanksTitle')}</h2>
          <p>${t('thanksText', ev.title)}</p>
          <a class="button" href="event.html?event=${ev.slug}">${t('backToEvent')}</a>
        </div>
      `, () => { /* thank-you screen: nothing to re-fetch, language switch just re-renders same text */
        render(`
          <div class="em-card">
            <h2>${t('thanksTitle')}</h2>
            <p>${t('thanksText', ev.title)}</p>
            <a class="button" href="event.html?event=${ev.slug}">${t('backToEvent')}</a>
          </div>
        `, rerenderCurrent);
      });
    });
  }

  init();
</script>

</body>
</html>
