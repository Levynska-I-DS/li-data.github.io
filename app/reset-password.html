<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neues Passwort – Event Manager</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../events/events.css">
</head>
<body class="em-public-theme">

<header>
  <h1>Event Manager</h1>
</header>

<section class="em-container">
  <div class="em-card" style="max-width:400px;margin:40px auto;">
    <h2>Neues Passwort festlegen</h2>

    <p id="status-msg">Link wird geprüft …</p>

    <p id="invalid-msg" style="display:none;">
      Dieser Link ist ungültig oder abgelaufen. Bitte fordere über die
      <a href="login.html">Anmeldeseite</a> einen neuen Link an.
    </p>

    <form id="reset-form" class="em-form" style="display:none;">
      <label for="password1">Neues Passwort</label>
      <input type="password" id="password1" required minlength="8">
      <label for="password2">Neues Passwort wiederholen</label>
      <input type="password" id="password2" required minlength="8">
      <p id="error-msg" style="color:#cc0000; display:none;"></p>
      <p id="success-msg" style="color:var(--color-text-muted); display:none;"></p>
      <button type="submit" class="button" style="margin-top:16px;">Passwort speichern</button>
    </form>
  </div>
</section>

<footer>© 2026 Familienschabbat-Team</footer>

<script type="module">
  import { supabase } from '../shared/supabase-client.js';

  const statusMsg = document.getElementById('status-msg');
  const invalidMsg = document.getElementById('invalid-msg');
  const form = document.getElementById('reset-form');
  const errorMsg = document.getElementById('error-msg');
  const successMsg = document.getElementById('success-msg');

  let ready = false;

  function showForm() {
    if (ready) return;
    ready = true;
    statusMsg.style.display = 'none';
    invalidMsg.style.display = 'none';
    form.style.display = 'block';
  }

  // supabase-js parses the recovery token out of the URL on page load and,
  // if valid, fires a PASSWORD_RECOVERY event with a real (temporary) session.
  // This is the officially supported way to detect "yes, this visitor came
  // from a genuine password-reset email link" -- not just anyone landing
  // on this page.
  supabase.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') {
      showForm();
    }
  });

  // If the session was already established by the time this script runs
  // (can happen depending on timing), showForm() too.
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    showForm();
  }

  // Give the URL-token parsing a moment; if nothing showed up by then,
  // this is not a valid/fresh recovery link.
  setTimeout(() => {
    if (!ready) {
      statusMsg.style.display = 'none';
      invalidMsg.style.display = 'block';
    }
  }, 2500);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';

    const p1 = document.getElementById('password1').value;
    const p2 = document.getElementById('password2').value;

    if (p1 !== p2) {
      errorMsg.textContent = 'Die beiden Passwörter stimmen nicht überein.';
      errorMsg.style.display = 'block';
      return;
    }

    const { error } = await supabase.auth.updateUser({ password: p1 });
    if (error) {
      errorMsg.textContent = 'Fehler: ' + error.message;
      errorMsg.style.display = 'block';
      return;
    }

    successMsg.textContent = 'Passwort gespeichert. Du wirst weitergeleitet …';
    successMsg.style.display = 'block';
    form.querySelector('button').disabled = true;
    setTimeout(() => {
      window.location.href = 'events/events.html';
    }, 1500);
  });
</script>

</body>
</html>
