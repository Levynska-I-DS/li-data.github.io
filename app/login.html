<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anmeldung – Event Manager</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../events/events.css">
</head>
<body class="em-public-theme">

<header>
  <h1>Event Manager</h1>
</header>

<section class="em-container">
  <div class="em-card" style="max-width:400px;margin:40px auto;">
    <h2>Anmeldung</h2>
    <form id="login-form" class="em-form">
      <label for="email">E-Mail</label>
      <input type="email" id="email" required>
      <label for="password">Passwort</label>
      <input type="password" id="password" required>
      <p id="error-msg" style="color:#cc0000; display:none;"></p>
      <button type="submit" class="button" style="margin-top:16px;">Anmelden</button>
    </form>
  </div>
</section>

<footer>© 2026 Familienschabbat-Team</footer>

<script type="module">
  import { supabase } from '../shared/supabase-client.js';

  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    window.location.href = 'events/events.html';
  }

  const form = document.getElementById('login-form');
  const errorMsg = document.getElementById('error-msg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.style.display = 'none';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) {
      errorMsg.textContent = 'Fehler: ' + error.message;
      errorMsg.style.display = 'block';
      return;
    }
    window.location.href = 'events/events.html';
  });
</script>

</body>
</html>
